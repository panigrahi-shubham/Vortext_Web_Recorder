<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Demo Shop - Item</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <a href="inventory.html">Back to products</a>
  <h1 id="item-title"></h1>
  <p id="item-price"></p>
</main>
<script src="app.js"></script>
<script>
  var id = +new URLSearchParams(location.search).get('id');
  var p = shop.PRODUCTS.filter(function (x) { return x.id === id; })[0];
  document.getElementById('item-title').textContent = p ? p.name : 'Not found';
  document.getElementById('item-price').textContent = p ? shop.money(p.price) : '';
</script>
</body>
</html>
