<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My account</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <script>if (!localStorage.getItem('user')) location.replace('index.html');</script>
  <h1>My account</h1>
  <p id="hello"></p>
  <button class="btn" type="button" onclick="document.getElementById('orders').hidden=false">Show orders</button>
  <ul id="orders" hidden><li>Order 1</li><li>Order 2</li></ul>
  <script>document.getElementById('hello').textContent = 'Signed in as ' + localStorage.getItem('user');</script>
</main></body>
</html>
