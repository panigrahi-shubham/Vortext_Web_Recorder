name: Verify both products
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TPHUB_HEADLESS: '1'
      VORTEX_EXTENSION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - run: npm ci
      - run: npm ci --prefix extension
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run typecheck:extension
      - run: npm run qa:check
      - run: npm run test:extension
      - run: npm run build
      - run: npm test
      - run: npm run release
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-v3-${{ matrix.os }}
          path: artifacts/
